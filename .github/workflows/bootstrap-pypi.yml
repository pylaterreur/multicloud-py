name: Bootstrap production PyPI

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Package batch to publish, or all packages for a tagged release
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "7", "all"]

permissions: {}

concurrency:
  group: pypi-bootstrap-${{ github.sha }}-${{ inputs.batch }}
  cancel-in-progress: false

jobs:
  select-bootstrap-batch:
    name: Select production PyPI bootstrap batch
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          batch_1='{"include":[{"project":"multicloud-py-common"},{"project":"multicloud-py-aws-common"},{"project":"multicloud-py-gcp-common"}]}'
          batch_2='{"include":[{"project":"multicloud-py-blob"},{"project":"multicloud-py-blob-aws"},{"project":"multicloud-py-blob-gcp"}]}'
          batch_3='{"include":[{"project":"multicloud-py-blob-alibaba"},{"project":"multicloud-py-docstore"},{"project":"multicloud-py-docstore-aws"}]}'
          batch_4='{"include":[{"project":"multicloud-py-docstore-gcp-firestore"},{"project":"multicloud-py-iam"},{"project":"multicloud-py-iam-aws"}]}'
          batch_5='{"include":[{"project":"multicloud-py-iam-gcp"},{"project":"multicloud-py-pubsub"},{"project":"multicloud-py-pubsub-aws"}]}'
          batch_6='{"include":[{"project":"multicloud-py-pubsub-gcp"},{"project":"multicloud-py-pubsub-alibaba"},{"project":"multicloud-py-sts"}]}'
          batch_7='{"include":[{"project":"multicloud-py-sts-aws"},{"project":"multicloud-py-sts-gcp"},{"project":"multicloud-py-sts-alibaba"}]}'
          case "${{ inputs.batch }}" in
            1)
              matrix="${batch_1}"
              ;;
            2)
              matrix="${batch_2}"
              ;;
            3)
              matrix="${batch_3}"
              ;;
            4)
              matrix="${batch_4}"
              ;;
            5)
              matrix="${batch_5}"
              ;;
            6)
              matrix="${batch_6}"
              ;;
            7)
              matrix="${batch_7}"
              ;;
            all)
              matrix="$(jq -cn \
                --argjson batch_1 "${batch_1}" \
                --argjson batch_2 "${batch_2}" \
                --argjson batch_3 "${batch_3}" \
                --argjson batch_4 "${batch_4}" \
                --argjson batch_5 "${batch_5}" \
                --argjson batch_6 "${batch_6}" \
                --argjson batch_7 "${batch_7}" \
                '$batch_1.include + $batch_2.include + $batch_3.include + $batch_4.include + $batch_5.include + $batch_6.include + $batch_7.include | {include: .}')"
              ;;
            *)
              echo "Unsupported bootstrap batch: ${{ inputs.batch }}" >&2
              exit 1
              ;;
          esac
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-and-validate:
    name: Build and validate selected branch
    needs: select-bootstrap-batch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --all-groups --all-packages
      - run: uv run --frozen python -m black --check packages tests scripts
      - run: uv run --frozen python -m isort --check-only packages tests scripts
      - run: uv run --frozen python scripts/sync_version.py --check
      - run: uv run --frozen python -m pytest -m 'not conformance'
      - run: uv run --frozen python -m pytest -m conformance --record-mode=none
      - run: uv build --all-packages --no-sources --out-dir dist
      - run: uv run --frozen python -m twine check dist/*
      - run: uv run --frozen python -m scripts.validate_release_artifacts dist
      - run: uv run --frozen python -m scripts.smoke_test_release_artifacts dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-bootstrap-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish bootstrap batch to PyPI
    needs: [select-bootstrap-batch, build-and-validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select-bootstrap-batch.outputs.matrix) }}
    environment: pypi-${{ matrix.project }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-bootstrap-${{ github.sha }}
          path: dist
      - name: Select this project's distributions
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          normalized_project="${PROJECT//-/_}"
          mkdir package-dist
          find dist -maxdepth 1 -type f -name "${normalized_project}-*" -exec cp {} package-dist/ \;
          test "$(find package-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: package-dist/
          verbose: true
