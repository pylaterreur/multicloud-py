name: TestPyPI Rehearsal

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --all-groups --all-packages
      - run: uv run --frozen python -m black --check packages tests scripts
      - run: uv run --frozen python -m isort --check-only packages tests scripts
      - run: uv run --frozen python scripts/sync_version.py --check
      - run: uv run --frozen python -m pytest -m 'not conformance'
      - run: uv run --frozen python -m pytest -m conformance --record-mode=none
      - run: uv build --all-packages --no-sources --out-dir dist
      - run: uv run --frozen python -m twine check dist/*
      - run: uv run --frozen python -m scripts.validate_release_artifacts dist
      - run: uv run --frozen python -m scripts.smoke_test_release_artifacts dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-rehearsal-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-rehearsal-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: true
